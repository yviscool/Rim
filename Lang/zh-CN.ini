help.general=Rim 快捷键帮助\n\n模式切换:\n  i        - 进入插入模式\n  <Esc>    - 返回正常模式\n\n方向键:\n  h/j/k/l  - 左/下/上/右\n  <C-j/k>  - 鼠标上/下移动\n  <C-h/l>  - 鼠标左/右移动\n\n窗口管理:\n  zc       - 居中窗口\n  zf       - 全屏窗口\n  zm       - 最大化窗口\n  zn       - 最小化窗口\n  zr       - 还原窗口\n  za/zA    - 置顶/取消置顶\n  zt       - 切换标题栏\n\n标签页:\n  t        - 新建标签页\n  x        - 关闭标签页\n  gn/gp    - 下一个/上一个\n  g1-g9    - 切换到标签1-9\n\n其他:\n  F5       - 重新加载\n  zw       - 网络搜索\n  zs       - 挂起机器\n
help.foobar=Foobar2000 快捷键帮助\n\n播放控制:\n  <Space>  - 播放/暂停\n  n        - 下一首\n  p        - 上一首\n  s        - 停止\n\n音量控制:\n  +        - 音量增加\n  -        - 音量减少\n  z        - 静音\n\n导航:\n  gg       - 跳到开头\n  G        - 跳到结尾\n  <C-u>    - 上一页\n  <C-d>    - 下一页\n\n标签页:\n  t        - 下一个标签\n  m        - 上一个标签\n\n其他:\n  /        - 搜索\n  <C-w>h   - 定位到目录窗口\n  <C-w>l   - 定位到播放列表\n
help.launcher=Rim 帮助\n\n热键:\n  Enter - 执行选中命令\n  Up Down 或 Ctrl+J K - 上下移动选择\n  Ctrl+F B - 下翻 上翻页\n  Alt+字母/数字 - 按首字母/序号执行\n  Tab/→ - 接受灰字补全, Ctrl+→接受一词\n  Alt+↑↓ - 按内容翻历史 (↑↓仍翻列表)\n  Ctrl+Enter - 保存为管道参数\n  Space - 结果过滤模式\n  Ctrl+H - 显示历史\n  Ctrl+N P - 增加 减少权重\n  Ctrl+D - 打开文件目录\n  Ctrl+X - 删除文件\n  Ctrl+S - 显示完整路径\n  Ctrl+L U - 清空输入\n  Ctrl+I O - 光标到行首 行尾\n  F1 - 帮助\n  Shift+F1 - 按键帮助\n  F2 F3 - 编辑配置 自动配置\n  Ctrl+R - 重建索引\n  Ctrl+Q - 重启\n  Esc - 清空 关闭\n\n命令前缀:\n  `; - AHK运行\n  : - CMD运行\n  | - 管道参数\n  @ - 跳转\n  直接输入 URL - 打开浏览器\n
help.keyhelp=Rim 按键帮助\n\n  Shift+F1 - 显示置顶按键帮助\n  Alt+F4 - 关闭\n  Enter - 执行当前命令\n  Esc - 关闭窗口\n  Alt+字母/数字 - 按首字母/序号执行\n  Tab - 接受灰字补全, Alt+↑↓翻历史\n  Ctrl+J K - 下 上一个命令\n  Ctrl+F B - 下翻 上翻页\n  Ctrl+H - 显示历史\n  Ctrl+N P - 增加 减少权重\n  Ctrl+L - 清空输入框\n  Ctrl+R - 重建文件索引\n  Ctrl+Q - 重启\n  F2 - 编辑配置文件\n  F3 - 编辑自动配置\n
