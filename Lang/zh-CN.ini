help.misc=Rim 快捷键帮助

通用:
  i        - 进入 insert 模式
  Esc      - 返回 normal 模式
  j/k/h/l  - 下/上/左/右移动
  t        - 新建标签页
  x        - 关闭标签页
  gn/gp    - 下/上一个标签页
  g1-g9    - 切换到标签页 1-9
  zj/zk    - 移动窗口下/上
  zh/zl    - 移动窗口左/右
  zm/zn    - 最大化/最小化窗口
  za       - 窗口置顶

快速启动:
  Win+J    - 打开快速启动器

右键托盘图标查看更多选项
