help.keytext=* | 按键 | Shift + F1  | 显示置顶按键帮助\n* | 按键 | Alt + F4    | 关闭置顶按键帮助\n* | 按键 | Enter       | 执行当前命令\n* | 按键 | Esc         | 关闭窗口\n* | 按键 | Alt +       | 按首字母执行本行\n* | 按键 | Alt + 数字  | 按序号执行本行 (0=第10项)\n* | 按键 | Tab / →     | 接受灰字补全\n* | 按键 | Ctrl + →    | 接受补全一词\n* | 按键 | 退格/删除   | 灰字时先去灰字再删\n* | 按键 | Alt+↑↓      | 按内容翻历史\n* | 按键 | Esc         | 先取消补全/历史, 再关闭\n* | 按键 | Win  + j    | 切换窗口\n* | 按键 | Ctrl + j    | 下一个命令\n* | 按键 | Ctrl + k    | 上一个命令\n* | 按键 | Ctrl + f    | 输出区下翻页\n* | 按键 | Ctrl + b    | 输出区上翻页\n* | 按键 | Ctrl + h    | 显示历史\n* | 按键 | Ctrl + n    | 增加命令权重\n* | 按键 | Ctrl + p    | 减少命令权重\n* | 按键 | Ctrl + l    | 清空输入框\n* | 按键 | Ctrl + r    | 重建文件索引\n* | 按键 | Ctrl + q    | 重启\n* | 按键 | Ctrl + d    | 在 TC 打开当前文件目录\n* | 按键 | Ctrl + s    | 显示并复制完整路径\n* | 按键 | Ctrl + x    | 删除当前文件\n* | 按键 | Ctrl + i    | 光标到行首\n* | 按键 | Ctrl + o    | 光标到行尾\n* | 按键 | F2          | 编辑配置文件\n* | 按键 | F3          | 编辑自动配置\n* | 功能 | URL 输入   | 直接输入网址打开浏览器\n* | 功能 | ; 前缀     | 用 AHK 运行命令\n* | 功能 | : 前缀     | 用 CMD 运行命令\n* | 功能 | 无结果     | 回车走 AHK 运行\n* | 功能 | 空格       | 锁定搜索结果
