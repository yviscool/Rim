help.general=Rim hotkey help\n\nModes:\n  i        - Enter insert mode\n  <Esc>    - Return to normal mode\n\nMovement:\n  h/j/k/l  - Left/Down/Up/Right\n  <C-j/k>  - Move mouse up/down\n  <C-h/l>  - Move mouse left/right\n\nWindows:\n  zc       - Center window\n  zf       - Fullscreen window\n  zm       - Maximize window\n  zn       - Minimize window\n  zr       - Restore window\n  za/zA    - Always on top on/off\n  zt       - Toggle title bar\n\nTabs:\n  t        - New tab\n  x        - Close tab\n  gn/gp    - Next/previous\n  g1-g9    - Go to tabs 1-9\n\nMisc:\n  F5       - Reload\n  zw       - Web search\n  zs       - Suspend machine\n
help.foobar=Foobar2000 hotkey help\n\nPlayback:\n  <Space>  - Play/Pause\n  n        - Next track\n  p        - Previous track\n  s        - Stop\n\nVolume:\n  +        - Volume up\n  -        - Volume down\n  z        - Mute\n\nNavigation:\n  gg       - Jump to start\n  G        - Jump to end\n  <C-u>    - Page up\n  <C-d>    - Page down\n\nTabs:\n  t        - Next tab\n  m        - Previous tab\n\nMisc:\n  /        - Search\n  <C-w>h   - Focus directory tree\n  <C-w>l   - Focus playlist\n
help.launcher=Rim help\n\nHotkeys:\n  Enter - Run selected command\n  Up Down or Ctrl+J K - Move selection up/down\n  Ctrl+F B - Page down/up\n  Alt+letter - Run by first letter\n  Ctrl+Enter - Save as pipe arg\n  Space - Result filter mode\n  Ctrl+H - Show history\n  Ctrl+N P - Increase/decrease weight\n  Ctrl+D - Open file directory\n  Ctrl+X - Delete file\n  Ctrl+S - Show full path\n  Ctrl+L U - Clear input\n  Ctrl+I O - Cursor to line start/end\n  F1 - Help\n  Shift+F1 - Key help\n  F2 F3 - Edit config/auto config\n  Ctrl+R - Rebuild index\n  Ctrl+Q - Restart\n  Esc - Clear/close\n\nCommand prefixes:\n  `; - Run with AHK\n  : - Run with CMD\n  | - Pipe arg\n  @ - Jump\n  Type URL directly - Open browser\n
help.keyhelp=Rim key help\n\n  Shift+F1 - Show pinned key help\n  Alt+F4 - Close\n  Enter - Run current command\n  Esc - Close window\n  Alt+letter - Run by first letter\n  Ctrl+J K - Next/previous command\n  Ctrl+F B - Page down/up\n  Ctrl+H - Show history\n  Ctrl+N P - Increase/decrease weight\n  Ctrl+L - Clear input box\n  Ctrl+R - Rebuild file index\n  Ctrl+Q - Restart\n  F2 - Edit config file\n  F3 - Edit auto config\n
