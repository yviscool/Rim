name: i18n audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: i18n key coverage + placeholder consistency
        run: python tools/i18n_audit.py audit --check
      - name: residual report (advisory, never fails)
        run: python tools/i18n_audit.py stats
        continue-on-error: true
