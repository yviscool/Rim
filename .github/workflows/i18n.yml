name: i18n audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: i18n key coverage + placeholder consistency
        run: python tools/i18n_audit.py audit --check
      - name: residual report (advisory, never fails)
        run: python tools/i18n_audit.py stats
        continue-on-error: true

  smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download AutoHotkey v2 portable (pinned)
        run: |
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip" -OutFile "$env:RUNNER_TEMP\ahk.zip"
          Expand-Archive "$env:RUNNER_TEMP\ahk.zip" "$env:RUNNER_TEMP\ahk"
      - name: Parse smoke (all #Include must load)
        run: |
          & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut tools/smoke_parse.ahk
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content smoke_parse.out.txt -Raw).Trim() -ne "smoke-parse-ok") { exit 1 }
      - name: Register smoke (16 RegisterPlugin_* must resolve, en zero missing)
        run: |
          & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut tools/smoke_register.ahk
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sys,re; rows=open('smoke_register.out.txt',encoding='utf-8-sig').read().splitlines(); A=[l for l in rows if l.startswith('A|')]; C=[l for l in rows if l.startswith('C|')]; F=[l for l in rows if l.startswith('F|')]; CJK=re.compile(r'[\u4e00-\u9fff]'); bad=[l for l in A+C if not l.split('|')[-1] or CJK.search(l.split('|')[-1]) or re.match(r'^(act|cmd)\.', l.split('|')[-1])]; print(f'actions={len(A)} commands={len(C)} failures={len(F)} bad={len(bad)}'); sys.exit(1 if (F or bad or not A) else 0)"
      - name: SmartInput probe (pure functions, no GUI)
        run: |
          & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut tools/smoke_si.ahk
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Command/Context/Plugin/Workspace/Gesture/Audit probes
        run: |
          foreach ($p in @("smoke_command", "smoke_context", "smoke_plugin", "smoke_workspace", "smoke_gesture", "smoke_audit_fixes")) {
            & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut "tools/$p.ahk"
            if ($LASTEXITCODE -ne 0) { Write-Host "$p FAILED"; exit 1 }
          }
      - name: Gesture store/unified/fix/ui probes + 50-entry negative corpus
        run: |
          foreach ($p in @("probe_gesture_store", "probe_gesture_unified", "probe_gesture_fix", "probe_gesture_ui", "probe_gesture_ui_geometry")) {
            & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut "tools/$p.ahk"
            if ($LASTEXITCODE -ne 0) { Write-Host "$p FAILED"; exit 1 }
          }
      - name: Gesture benchmark (accuracy + P95<=30ms gate)
        run: |
          & "$env:RUNNER_TEMP\ahk\AutoHotkey64.exe" /ErrorStdOut tools/benchmark_gesture.ahk
          if ($LASTEXITCODE -ne 0) { exit 1 }
