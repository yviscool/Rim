; ============================================================
; 手势应用层: [GestureApp:名称] + 匹配键
; 匹配键: set_file(进程名) / set_class(窗口类) / set_title(标题包含) / set_title_regex(标题正则)
;   + set_owner_class(所有者窗口类) / set_ctrl_class(控件类) / set_ctrl_title(控件标题包含)
;   (StrokesPlus MatchCriteria ownerclass/controlclass 对等; 多值用 " | " 分隔)
; noglobal=1 则本层未命中时不再回退全局
; 手势键可加修饰前缀: CTRL+/ALT+/SHIFT+ (如 CTRL+L)
; 形状与方向手势都用同一个名称查找应用动作。
; ============================================================
[GestureApp:TotalCommander]
set_file=TOTALCMD.EXE
D_R=key|{F7}
D_L=key|{F8}

; 原版 Internet Browsers 层整理: L/R=前后标签 U/D=首尾 U_D=恢复标签
; Up 后斜向右上/左上=前后页 (U_UR/U_UL); R_U=F11 全屏, U=F5
; 浏览器应用层可覆盖同名手势的全局动作。
[GestureApp:Browsers]
set_file=chrome.exe | firefox.exe | iexplore.exe
L=key|^+{Tab}
R=key|^{Tab}
U=key|{Home}
D=key|{End}
U_D=key|^+t
U_UR=key|!{Right}
U_UL=key|!{Left}
R_U=key|{F11}
; V: lower point then up; inverted V: peak then down. Match the StrokesPlus Up - Down reopen action.
DR_UR=key|{F5}
UR_DR=key|^+t
UL_DL=key|^+t
DL_UR=key|{F5}
LETTER_U=key|{F5}
V=key|{F5}
INVV=key|^+t
Z=combo|zoom
B=key|^d
J=key|^j
H=key|{Browser_Home}
3=key|^t

; Windows Terminal 层 (对标 Browsers: L/R=左右标签, 3=新增标签页; WT 默认键位)
[GestureApp:WindowsTerminal]
set_file=WindowsTerminal.exe | WindowsTerminalPreview.exe
set_class=CASCADIA_HOSTING_WINDOW_CLASS
L=key|^+{Tab}
R=key|^{Tab}
3=key|^+t
DR=key|^{F4}

; 原版 Desktop 层整理: 桌面上忽略 /Up /Down \Up (空动作吞掉; \Down 原版不忽略)
; 原版 MatchCriteria: ownerclass=WorkerW controlclass=SysListView32 controltitle=FolderView
; (无 class 条件: Win10+ 桌面宿主是 WorkerW, Progman 会导致永远不命中)
[GestureApp:Desktop]
set_file=explorer.exe
set_ctrl_class=SysListView32
set_ctrl_title=FolderView
UR=function|Gesture_NoOp
DL=function|Gesture_NoOp
UL=function|Gesture_NoOp
UR_U=function|Gesture_NoOp
DR_D=function|Gesture_NoOp
UL_U=function|Gesture_NoOp

