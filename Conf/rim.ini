; VimRunZ 配置文件
; 完整迁移 RunZ 和 VimDesktop 配置
; 细节就是魔鬼 - 每个选项都要准确

; ============================================================
; Config 部分 - RunZ 兼容配置选项
; ============================================================
[Config]
; RunZ: 创建"发送到"菜单 (1创建, 0删除)
CreateSendToLnk=1
; RunZ: 开机自启动
CreateStartupLnk=1
; RunZ: 搜索的目录，使用 " | " 分隔
SearchFileDir=D:\software
; RunZ: 搜索的文件类型，使用 " | " 分隔
SearchFileType=*.exe | *.lnk
; RunZ: 排除的文件(正则)
SearchFileExclude=[Uu]ninstall|unins|uninst|卸载|\.exe_bk$
; RunZ: 搜索完整路径 (0=只搜文件名)
SearchFullPath=0
; RunZ: 在界面显示文件扩展名
ShowFileExt=0
; RunZ: tcmatch.dll 路径 (空则用InStr匹配)
TCMatchPath=Lib\TCMatch\tcmatch.dll
; RunZ: 退出时保存编辑框内容
SaveInputText=0
; RunZ: 窗口隐藏时不清空编辑框内容
KeepInputText=1
; RunZ: 运行一次命令就退出
RunOnce=0
; RunZ: 结果只有一个时直接运行
RunIfOnlyOne=0
; RunZ: TotalCommander 路径
TCPath=D:\software\TotalCMD64\totalcmd64.exe
; RunZ: 在后台运行
RunInBackground=1
; RunZ: 加载控制面板功能
LoadControlPanelFunctions=1
; RunZ: 窗口失去焦点后关闭
ExitIfInactivate=1
; RunZ: 窗口置顶显示
WindowAlwaysOnTop=0
; RunZ: 记录历史
SaveHistory=1
; RunZ: 历史记录数量
HistorySize=15
; RunZ: 自动调节排序
AutoRank=1
; RunZ: 单击执行命令 (0=只定位)
ClickToRun=1
; RunZ: 每次激活切换到英文输入法
SwitchToEngIME=0
; RunZ: 鼠标移动时定位命令
ChangeCommandOnMouseMove=0
; RunZ: Esc清空输入 (0=无内容时关闭)
ClearInputWithEsc=0
; RunZ: 配置文件编辑器
Editor=
; RunZ: 发送到菜单简单模式
SendToMenuSimpleMode=1
; RunZ: 发送到菜单读取lnk目标
SendToMenuReadLnkFile=1
; RunZ: 调试模式
DebugMode=0

; ============================================================
; VimDesktop 配置选项
; ============================================================
; 是否默认开启快捷键提示
default_enable_show_info=1
; 配置编辑器
editor=
; RunZ 目录
runz_dir=D:\software\runz\
; 启用日志
enable_log=0
; 打开调试窗口
enable_debug=0

; ============================================================
; Gui 部分 - 界面配置
; ============================================================
[Gui]
; 指定皮肤名 (空则用此[Gui]配置, 默认 New 即 RunZ 同款配色)
Skin=New
; 隐藏标题栏
HideTitle=1
; 显示托盘图标
ShowTrayIcon=1
; 在下方详情框显示当前命令
ShowCurrentCommand=1
; 列表中显示的行数
DisplayRows=15
; 第三列宽度
DisplayCol3MaxLength=25
; 第四列宽度
DisplayCol4MaxLength=35
; 隐藏第二列
HideCol2=0
; 第四列为空时隐藏
HideCol4IfEmpty=1
; 字体名称
FontName=宋体
; 字体大小
FontSize=12
; 字体颜色
FontColor=000000
; 输入框和输出框宽度
WidgetWidth=600
; 输入框和详情框高度
EditHeight=24
; 输出框高度
DisplayAreaHeight=246
; 列表第一行首字母
FirstChar=a
; 输入框颜色
EditColor=ffffff
; 背景色
BackgroundColor=f1f1f1
; 背景图片
BackgroundPicture=1.png
; 边框宽度
BorderSize=15
; 当输入框为空时只显示输入框
ShowInputBoxOnlyIfEmpty=0
; 圆形边角 (0=方形)
RoundCorner=0

; ============================================================
; 窗口排除列表
; ============================================================
[exclude]
vim=
vimrunz=
AutoHotkey=
ahk_class AutoHotkey

; ============================================================
; 全局热键
; ============================================================
[GlobalHotkey]
#j=ToggleWindow
; Win+` 切换窗口
#`=ToggleWindow
; Win+Esc 切换窗口
#Esc=ToggleWindow
; Alt+Space 切换窗口
!Space=ToggleWindow
; Alt+E 打开TC
!e=<TC_ToggleTC>
; Win+W 切换Vim编辑器
#w=<VimEditor_Toggle>

; ============================================================
; 快速启动热键
; ============================================================
[Hotkey]

; ============================================================
; 插件开关
; ============================================================
[Plugins]
General=1
StrokePlus=1
TotalCommander=1
Explorer=1
WinMerge=1
BeyondCompare4=1
Foobar2000=1
TCDialog=1
TCCompare=1
MicrosoftExcel=1
Misc=1
QRCode=1
Kanji=1
LauncherCore=1
LauncherSystem=1
VimEditor=1
VimDConfig=1

; ============================================================
; 鼠标手势 (StrokePlus 重构 P1)
; 按住右键拖拽画手势, 松开触发; 短点=普通右键
; 手势方向: R/L/U/D + UR/UL/DR/DL, 多笔用 _ 连接 (如 D_R)
; 动作语法与 VIMD_CMD 一致: run|/key|/function|/<Action名>
; ============================================================
[Gesture]
Enable=1
; 触发键: RButton/MButton/XButton1/XButton2
Trigger=RButton
Threshold=20
Segment=30
ShowOSD=1
; 未命中: swallow=吞+提示 / sound=提示音 / passthrough=透传点击
NoMatch=swallow
; 按住此键时手势暂停 (如 Shift, 空=关闭)
IgnoreKey=
; 仅限定应用: 1=无应用层匹配时手势全旁路
OnlyDefinedApps=0
; 轨迹线: 1=显示 (XOR反色, 任意背景可见)
Trail=0
TrailColor=45ABFF
TrailWidth=5
; 模板匹配阈值 0-100 (原版 MatchProbabilityThreshold=75)
TemplateThreshold=75

[Gestures]
; 原版 StrokesPlus 对齐: / Up=最大化 / Down=最小化 U=复制 D=粘贴 U_D=刷新
; 单字母 (e/G/U/R/D/P/L/N/S/M/Z/B/J/h/X/3) 走模板匹配, 见 [GestureTemplates]
L=key|{Browser_Back}
R=key|{Browser_Forward}
U=key|^c
D=key|^v
UR_U=<wm_max>
DR_D=<wm_min>
UL_U=key|!{F4}
U_D=key|{F5}
U_D_U=<Reload>
D_R=<SP_NewTab>
D_L=<SP_CloseTab>
DL_D=key|^w
L_R=key|#{Left}
R_L=key|#{Right}
U_R=<SP_VolUp>
U_L=<SP_VolDown>
R_D=<SP_End>
L_D=run|explorer.exe
R_U=<SP_Home>
L_U=<SP_Home>
DR=key|{Browser_Forward}
DL=key|{Browser_Back}
UL=key|{BackSpace}
UR=key|{Tab}
D_L_D=function|Gesture_IgnoreNext
; 滚轮手势: 按住触发键时滚轮改道
WheelUp=<Gen_NextTab>
WheelDown=<Gen_PrevTab>
CTRL+WheelUp=<SP_VolUp>
CTRL+WheelDown=<SP_VolDown>

; ============================================================
; 手势黑名单: 命中则手势全旁路, 右键行为完全不变
; 每行一个模式: exe/类名精确匹配(不分大小写), 或标题包含
; 例:
; GAME.EXE
; TTOTAL_CMD
; ============================================================
[GestureBlacklist]

; ============================================================
; 手势应用层: [GestureApp:名称] + 匹配键
; 匹配键: set_file(进程名) / set_class(窗口类) / set_title(标题包含) / set_title_regex(标题正则)
; noglobal=1 则本层未命中时不再回退全局
; 手势键可加修饰前缀: CTRL+/ALT+/SHIFT+ (如 CTRL+L)
; ============================================================
[GestureApp:TotalCommander]
set_file=TOTALCMD.EXE
D_R=key|{F7}
D_L=key|{F8}

; 原版 Internet Browsers 层整理: L/R=前后标签 U/D=首尾 U_D=恢复标签
; 模板覆盖用 TPL:名前缀 (如 TPL:U=刷新, 覆盖模板 U 的撤销)
[GestureApp:Browsers]
set_file=chrome.exe | msedge.exe | firefox.exe | brave.exe | opera.exe | iexplore.exe
L=key|^+{Tab}
R=key|^{Tab}
U=key|{Home}
D=key|{End}
U_D=key|^+t
TPL:U=key|{F5}

; 原版 Desktop 层整理: 桌面上忽略斜线手势 (空动作吞掉)
[GestureApp:Desktop]
set_file=explorer.exe
set_class=Progman
UR_U=function|Gesture_NoOp
DR_D=function|Gesture_NoOp
UL_U=function|Gesture_NoOp

; ============================================================
; 字母/异形手势模板: name=action|||x1,y1 x2,y2 ... (32 点 0-64 网格)
; 内置 e/G/U/R/D/P/L/N/S/M/Z/B/J/h/X/3, 在管理器里重录同名即覆盖
; ============================================================
[GestureTemplates]

; ============================================================
; 回退命令配置
; ============================================================
[FallbackCommand]
; RunZ: 回退命令 - 搜索不到时显示
; 格式: type | name | description
function | AhkRun | 使用 Ahk 的 Run() 运行 ; command
function | CmdRun | 使用 cmd 运行 : command
function | WinRRun | 使用 win + r 运行
function | RunAndDisplay | 使用 cmd 运行，并显示结果
function | SearchOnGoogle | 使用 谷歌 搜索剪切板或输入内容
function | SearchOnBaidu | 使用 百度 搜索剪切板或输入内容
function | SearchOnBing | 使用 必应 搜索剪切板或输入内容

