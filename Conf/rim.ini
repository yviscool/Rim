; ============================================================
; VimEditor 配置 - 记事本等编辑器的vim模式
; 单窗持久开关: 在对应窗口节加一行 vim_enable=0 即永久关闭该窗接管 (重启仍有效, 如 [Notepad]/[Typora]);
; Win+W 只做当前窗口的临时开关. 缺省(不写)即启用.
; ============================================================
[Notepad]
set_class=Notepad
set_file=notepad.exe
set_time_out=800
set_max_count=1000
enable_show_info=1
i=<Gen_InsertMode>[=normal]
<esc>=<Gen_NormalMode>[=insert]
j=<down>[=normal]
k=<up>[=normal]
h=<left>[=normal]
l=<right>[=normal]
w=<word>[=normal]
b=<wordb>[=normal]
e=<wordend>[=normal]
0=<home>[=normal]
<S-4>=<end>[=normal]
dd=<deletedLine>[=normal]
yy=<copyLine>[=normal]
p=<paste>[=normal]
u=<undo>[=normal]
<c-r>=<redo>[=normal]
x=<deletechar>[=normal]
; 注: i 已在上部映射为 <Gen_InsertMode>, 与 insertBefore 同效, 不重复
a=<insertAfter>[=normal]
o=<insertNewLine>[=normal]
I=<insertLineStart>[=normal]
A=<insertLineEnd>[=normal]
O=<insertLineAbove>[=normal]
v=<visualMode>[=normal]
/=<search>[=normal]
n=<nextMatch>[=normal]
N=<prevMatch>[=normal]

; ============================================================
; Typora 配置
; ============================================================
[Typora]
set_class=Typora
set_file=Typora.exe
set_time_out=800
set_max_count=1000
enable_show_info=1

; ============================================================
; 命令提示符配置
; ============================================================
[ConsoleWindowClass]
set_class=ConsoleWindowClass
set_file=cmd.exe
set_time_out=800
set_max_count=100
enable_show_info=1

; ============================================================
; Notepad++ 配置
; ============================================================
[Notepad++]
set_class=Notepad++
set_file=notepad++.exe
set_time_out=800
set_max_count=1000
enable_show_info=1

; ============================================================
; 自定义命令 (RunZ格式)
; 格式: name=type | content | description
; ============================================================
[Commands]
; 运行程序 (注: calc/google系移至插件, 避免遮挡带参命令的首匹配)
notepad=run|notepad.exe|记事本
mspaint=run|mspaint.exe|画图
cmd=run|cmd.exe|命令提示符
regedit=run|regedit.exe|注册表
taskmgr=run|taskmgr.exe|任务管理器
explorer=run|explorer.exe|资源管理器

; 网址 (无参直达; 带参搜索走 Misc 插件的 {query} 模板)
youtube=url|https://www.youtube.com|YouTube

; 函数 (须指向真实函数名; settings 已由 EditConfig 直注命令覆盖, 搜 settings 照样命中)
reload=function|RestartRunZ|重启
exit=function|ExitRunZ|退出
