; ============================================================
; VimEditor 配置 - 记事本等编辑器的vim模式
; ============================================================
[Notepad]
set_class=Notepad
set_file=notepad.exe
set_time_out=800
set_max_count=1000
enable_show_info=1
i=<Gen_InsertMode>[=normal]
<esc>=<Gen_NormalMode>[=insert]
j=<down>[=normal]
k=<up>[=normal]
h=<left>[=normal]
l=<right>[=normal]
w=<word>[=normal]
b=<wordb>[=normal]
e=<wordend>[=normal]
0=<home>[=normal]
<S-4>=<end>[=normal]
dd=<deletedLine>[=normal]
yy=<copyLine>[=normal]
p=<paste>[=normal]
u=<undo>[=normal]
<c-r>=<redo>[=normal]
x=<deletechar>[=normal]
; 注: i 已在上部映射为 <Gen_InsertMode>, 与 insertBefore 同效, 不重复
a=<insertAfter>[=normal]
o=<insertNewLine>[=normal]
I=<insertLineStart>[=normal]
A=<insertLineEnd>[=normal]
O=<insertLineAbove>[=normal]
v=<visualMode>[=normal]
/=<search>[=normal]
n=<nextMatch>[=normal]
N=<prevMatch>[=normal]

