; VimRunZ 配置文件
; 完整迁移 RunZ 和 VimDesktop 配置
; 细节就是魔鬼 - 每个选项都要准确

; ============================================================
; Config 部分 - RunZ 兼容配置选项
; ============================================================
[Config]
; RunZ: 创建"发送到"菜单 (1创建, 0删除)
CreateSendToLnk=1
; RunZ: 开机自启动
CreateStartupLnk=1
; RunZ: 搜索的目录，使用 " | " 分隔
SearchFileDir=D:\software
; RunZ: 搜索的文件类型，使用 " | " 分隔
SearchFileType=*.exe | *.lnk
; RunZ: 排除的文件(正则)
SearchFileExclude=[Uu]ninstall|unins|uninst|卸载|\.exe_bk$
; RunZ: 搜索完整路径 (0=只搜文件名)
SearchFullPath=0
; RunZ: 在界面显示文件扩展名
ShowFileExt=0
; RunZ: tcmatch.dll 路径 (空则用InStr匹配)
TCMatchPath=Lib\TCMatch\tcmatch.dll
; RunZ: 退出时保存编辑框内容
SaveInputText=0
; RunZ: 窗口隐藏时不清空编辑框内容
KeepInputText=1
; RunZ: 运行一次命令就退出
RunOnce=0
; RunZ: 结果只有一个时直接运行
RunIfOnlyOne=0
; RunZ: TotalCommander 路径
TCPath=D:\software\TotalCMD64\totalcmd64.exe
; RunZ: 在后台运行
RunInBackground=1
; RunZ: 加载控制面板功能
LoadControlPanelFunctions=1
; RunZ: 窗口失去焦点后关闭
ExitIfInactivate=1
; RunZ: 窗口置顶显示
WindowAlwaysOnTop=0
; RunZ: 记录历史
SaveHistory=1
; RunZ: 历史记录数量
HistorySize=15
; RunZ: 自动调节排序
AutoRank=1
; Rim: 排序半衰期 (天, frecency 指数衰减; 越小越喜新, 越大越念旧, 0/非法回落 14)
RankHalfLife=14
; RunZ: 单击执行命令 (0=只定位)
ClickToRun=1
; RunZ: 每次激活切换到英文输入法
SwitchToEngIME=0
; RunZ: 鼠标移动时定位命令
ChangeCommandOnMouseMove=0
; RunZ: Esc清空输入 (0=无内容时关闭)
ClearInputWithEsc=0
; RunZ: 配置文件编辑器
Editor=
; RunZ: 发送到菜单简单模式
SendToMenuSimpleMode=1
; RunZ: 发送到菜单读取lnk目标
SendToMenuReadLnkFile=1
; RunZ: 调试模式
DebugMode=0
; Rim: 界面语言 (auto=跟系统, 或 zh-CN/en/ja/de/fr/es; 语言包见 Lang/, 缺键回落英文)
Language=auto

; ============================================================
; SmartInput - zsh 三件套移植 (灰字补全/历史翻找/输入校验)
; ============================================================
[SmartInput]
; 总开关 (0=关闭全部, 回到老行为)
Enabled=1
; 会话输入历史上限 (ghost + Alt+UpDown 的第一候选源)
MaxHist=100
; 输入校验防抖毫秒 (未知命令头粉底提示)
ValidateDelay=300
; 隐私追加黑名单 (子串匹配, 不记历史; 内置 password/token/secret/身份证/密码等)
PrivacyExtra=

; ============================================================
; VimDesktop 配置选项
; ============================================================
; 是否默认开启快捷键提示
default_enable_show_info=1
; 配置编辑器
editor=
; RunZ 目录
runz_dir=D:\software\runz\
; 启用日志
enable_log=0
; 打开调试窗口
enable_debug=0

; ============================================================
; Gui 部分 - 界面配置
; ============================================================
[Gui]
; 指定皮肤名 (空则用此[Gui]配置, 默认 New 即 RunZ 同款配色)
Skin=New
; 隐藏标题栏
HideTitle=1
; 显示托盘图标
ShowTrayIcon=1
; 在下方详情框显示当前命令
ShowCurrentCommand=1
; 列表中显示的行数
DisplayRows=15
; 第三列宽度
DisplayCol3MaxLength=25
; 第四列宽度
DisplayCol4MaxLength=35
; 隐藏第二列
HideCol2=0
; 第四列为空时隐藏
HideCol4IfEmpty=1
; 字体名称
FontName=宋体
; 字体大小
FontSize=12
; 字体颜色
FontColor=000000
; 输入框和输出框宽度
WidgetWidth=600
; 输入框和详情框高度
EditHeight=24
; 输出框高度
DisplayAreaHeight=246
; 列表第一行首字母
FirstChar=a
; 输入框颜色
EditColor=ffffff
; 背景色
BackgroundColor=f1f1f1
; 背景图片
BackgroundPicture=1.png
; 边框宽度
BorderSize=15
; 当输入框为空时只显示输入框
ShowInputBoxOnlyIfEmpty=0
; 圆形边角 (0=方形)
RoundCorner=0

; ============================================================
; 窗口排除列表
; ============================================================
[exclude]
vim=
vimrunz=
AutoHotkey=
ahk_class AutoHotkey

; ============================================================
; 全局热键
; ============================================================
[GlobalHotkey]
#j=ToggleWindow
; Win+` 切换窗口
#`=ToggleWindow
; Win+Esc 切换窗口
#Esc=ToggleWindow
; Alt+Space 切换窗口
!Space=ToggleWindow
; Alt+E 打开TC
!e=<TC_ToggleTC>
; Win+W 切换Vim编辑器
#w=<VimEditor_Toggle>
; Alt+H 一键居中活动窗口 (Rim 窗口内 Alt+H 仍为执行第 H 行, 全局其他窗口生效)
!h=CenterActiveWindow

; ============================================================
; 快速启动热键
; ============================================================
[Hotkey]

; ============================================================
; 插件开关
; ============================================================
[Plugins]
General=1
StrokePlus=1
TotalCommander=1
Explorer=1
WinMerge=1
BeyondCompare4=1
Foobar2000=1
; 注意: TCDialog=1 仅建空实例, 需 [TotalCommander_Config] AsOpenFileDialog=1 才真正接管文件对话框
TCDialog=1
TCCompare=1
; 待 COM 重移植 (Plugins/MicrosoftExcel.ahk 无 RegisterPlugin_* 入口, 置 1 也不会加载)
MicrosoftExcel=0
Misc=1
QRCode=1
Kanji=1
LauncherCore=1
LauncherSystem=1
VimEditor=1
VimDConfig=1
StatsBall=1
Terminal=1

; ============================================================
; StatsBall 桌面三段雷达 (CPU / 内存 / 网速)
; ============================================================
[StatsBall]
Enable=1
RefreshMs=1000
SnapEdge=0
Opacity=255
AlertThreshold=85
TopMost=1
LockPos=1
StripW=156
StripH=40

; ============================================================
; 鼠标手势 (StrokePlus 重构 P1)
; 按住右键拖拽画手势, 松开触发; 短点=普通右键
; 手势方向: R/L/U/D + UR/UL/DR/DL, 多笔用 _ 连接 (如 D_R)
; 动作语法与 VIMD_CMD 一致: run|/key|/function|/<Action名>
; ============================================================
[Gesture]
Enable=1
; 触发键: RButton/MButton/XButton1/XButton2
Trigger=RButton
Threshold=6
Segment=6
; 采样轮询间隔毫秒 (越小轨迹越跟手, 越大 CPU 越低, 5-50)
Poll=10
; 停住超过此毫秒数后恢复原鼠标按键 (0=关闭; 调音量/滚轮缩放期间不触发)
CancelDelay=1500
ShowOSD=0
; 未识别时: swallow=忽略这一笔 / passthrough=模拟一次点击 / sound=提示音
NoMatch=swallow
; 按住此键时手势暂停 (如 Shift, 空=关闭)
IgnoreKey=
; 右键按住时点一下左键再滚滚轮=调系统音量 (1=启用, 0=关闭则左键直通)
VolLatch=1
; 仅限定应用: 1=无应用层匹配时手势全旁路
OnlyDefinedApps=0
; 轨迹线: 1=显示 (XOR反色, 任意背景可见)
Trail=0
TrailColor=45ABFF
TrailWidth=5
; 模板匹配阈值 0-100 (原版 MatchProbabilityThreshold=75; 旧别名 TplThreshold 同效)
TemplateThreshold=75

[GestureDefinitions]
V=template
INVV=template
G=template
P=template
N=template
S=template
M=template
X=template
Z=template
B=template
J=template
H=template
3=template
LETTER_U=template
LETTER_R=template
LETTER_D=template
LETTER_L=template

[Gestures]
; 原版 StrokesPlus 对齐:
; 单笔斜线 / Up(右上)=最大化 / Down(左下)=最小化 \ Up(左上)=Alt+F4 \ Down(右下)=Ctrl+W
; Right-Down=打开 Chrome; U=复制 D=粘贴 U_D=刷新
; 手势名称唯一。直线 U 和字母形状 LETTER_U 分别定义，再按应用覆盖动作。
; 单字母 (e/G/U/R/D/P/L/N/S/M/Z/B/J/h/X/3) 走模板匹配, 见 [GestureTemplates]
L=key|{Browser_Back}
R=key|{Browser_Forward}
U=key|^c
D=key|^v
UR=<wm_max>
DL=<wm_min>
UL=key|!{F4}
DR=key|^w
UR_U=<wm_max>
DR_D=<wm_min>
UL_U=key|!{F4}
U_D=key|{F5}
U_D_U=<Reload>
D_R=<SP_NewTab>
D_L=<SP_CloseTab>
DL_D=key|^w
L_R=key|#{Left}
R_L=key|#{Right}
R_D=run|D:\software\Chrome\App\Chrome.exe
L_D=run|explorer.exe
L_U=<SP_Home>
D_L_D=function|Gesture_IgnoreNext
G=run|https://www.google.com
P=<SP_PlayPause>
N=<SP_Next>
S=run|D:\software\SublimeText\sublime_text.exe
M=<SP_Mute>
X=key|^x
LETTER_U=key|^z
LETTER_R=key|^y
LETTER_D=function|Gesture_IgnoreNext
LETTER_L=key|{Media_Prev}
; 滚轮手势: 按住触发键时滚轮改道
; 右键按住+滚轮=前后切换任务栏窗口 (可循环); 右键按住时点一下左键再滚=调系统音量
WheelUp=<SP_TaskPrev>
WheelDown=<SP_TaskNext>
CTRL+WheelUp=<SP_VolUp>
CTRL+WheelDown=<SP_VolDown>

; ============================================================
; 手势黑名单: 命中则手势全旁路, 右键行为完全不变
; 每行一个模式: exe/类名精确匹配(不分大小写), 或标题包含
; 例:
; GAME.EXE
; TTOTAL_CMD
; ============================================================
[GestureBlacklist]
; 每行一个: exe/类名精确匹配 (大小写不敏感) 或标题包含; 命中则手势全旁路, 右键恢复原生行为
; 宁可多写 (写错顶多匹配不上), 不要漏写 (漏了则游戏里右键拖拽会触发手势)

